[project]
name = "pawwatch"
version = "0.1.0"
description = "Edge-AI cat health monitor: logs eat / drink / litter visits from fixed cameras, events only."
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "opencv-python",
    "streamlit",
    "ultralytics",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pawwatch"]

[tool.ruff]
line-length = 120
target-version = "py310"  # lowest Python we support (HailoRT's range)

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused names, undefined names
    "I",       # import order
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: syntax for the target Python
    "SIM",     # simplifications
    "C4",      # comprehensions
    "PTH",     # pathlib over os.path
    "RUF",     # ruff's own checks
    "BLE",     # blind `except Exception`: allowed only with a noqa that says why
]
allowed-confusables = ["–"]  # en dash in time ranges like 22:00–22:02
