[project]
name = "pawwatch"
version = "0.1.0"
description = "Edge-AI cat health monitor: logs eat / drink / litter visits from fixed cameras, events only."
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "opencv-python",
    "streamlit",
    "ultralytics",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pawwatch"]
